### file appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.maxFileSize=5MB
log4j.appender.file.maxBackupIndex=500
log4j.appender.file.File=${catalina.base}/logs/Auto/Auto.log
log4j.appender.file.threshold=info
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d {%t} %5p %c:%L - %m%n
#email appender
log4j.appender.mail=org.apache.log4j.net.SMTPAppender
#defines how othen emails are send
log4j.appender.mail.BufferSize=1
log4j.appender.mail.SMTPHost=smtp.zoho.com
log4j.appender.mail.smtpPort=587
log4j.appender.mail.smtpUsername=vthumma@ivbplus.com
log4j.appender.mail.smtpPassword=vijay125
log4j.appender.mail.From=techhelp@ivbplus.com.au
log4j.appender.mail.To=vthumma@ivbplus.com.au
log4j.appender.mail.Subject=AUTO_LOG
log4j.appender.mail.threshold=warn
log4j.appender.mail.layout=org.apache.log4j.PatternLayout
log4j.appender.mail.layout.ConversionPattern=%d {%t} %5p %c:%L - %m%n
log4j.rootLogger=INFO, file, mail

          

		
